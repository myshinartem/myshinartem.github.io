        :root {
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --border-soft: #e2e8f0;
            --shadow-float: 0 20px 40px -12px rgba(15, 23, 42, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.65;
            color: var(--text-main);
            background-color: var(--bg-page);
            -webkit-font-smoothing: antialiased;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: var(--shadow-float);
            border: 1px solid var(--border-soft);
            overflow: hidden;
            position: relative;
        }
        .header-block {
            background: linear-gradient(to bottom, #f8fafc 0%, #ffffff 100%);
            padding: 3.5rem 3rem 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-soft);
        }
        .header-block::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
        }
        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .title { font-size: 1.15rem; color: var(--primary); font-weight: 600; margin-bottom: 2rem; letter-spacing: -0.01em; }
        .contacts { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; }
        .contact-pill {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--bg-page); color: var(--text-secondary);
            text-decoration: none; font-size: 0.9rem; font-weight: 500;
            padding: 0.6rem 1.2rem; border-radius: 99px;
            border: 1px solid var(--border-soft);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .contact-pill:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
        
        .lang-switch { position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; }
        .lang-btn {
            padding: 0.4rem 0.8rem; border-radius: 8px; text-decoration: none;
            font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
            background: transparent; border: 1px solid var(--border-soft);
            transition: all 0.2s ease;
        }
        .lang-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
